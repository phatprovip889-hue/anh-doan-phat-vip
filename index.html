<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔥 ANH ĐOÀN PHÁT VIP</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:22px 16px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:22px}h1{text-align:center;margin:0 0 6px}.sub{text-align:center;color:#aaa;margin-bottom:22px}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #444;background:#0d0d0d;color:#fff;font-size:16px}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:800;border-radius:12px}.error{display:none;margin-top:12px;padding:13px;border-radius:12px;background:#3a1111;border:1px solid #a33;color:#ffb2b2;font-weight:700}.result{display:none;margin-top:18px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #292929}.value{font-weight:800}.suggest{display:none;margin-top:10px;color:#aaa;font-size:13px}.note{text-align:center;color:#888;font-size:12px;margin-top:16px}</style></head>
<body><div class="wrap"><div class="card"><h1>🔥 ANH ĐOÀN PHÁT VIP</h1><p class="sub">Tạo độ nhạy Free Fire theo đúng tên điện thoại</p>
<label>Tên điện thoại</label><input id="phone" list="phones" autocomplete="off" placeholder="Ví dụ: Samsung Galaxy A55 5G"><datalist id="phones"></datalist><div id="error" class="error"></div><div id="suggest" class="suggest"></div><button onclick="generate()">✨ TẠO ĐỘ NHẠY</button><div id="result" class="result"></div><p class="note">Chỉ model có trong danh sách mới được tạo độ nhạy.</p></div></div>
<script>
const phones=["Samsung Galaxy A55 5G","Samsung Galaxy A35 5G","Samsung Galaxy A25 5G","Samsung Galaxy A15 5G","Samsung Galaxy S24","Samsung Galaxy S24 Ultra","Samsung Galaxy S23","Samsung Galaxy S23 Ultra","Xiaomi Mi 10S","Redmi 9C","Redmi Note 14 Pro 5G","Redmi Note 14T 5G","iPhone 8","iPhone 8 Plus","iPhone X","iPhone 11","iPhone 11 Pro","iPhone 11 Pro Max","iPhone 12","iPhone 12 Pro","iPhone 12 Pro Max","iPhone 13","iPhone 13 Pro","iPhone 13 Pro Max","iPhone 14","iPhone 14 Pro","iPhone 14 Pro Max","iPhone 15","iPhone 15 Pro","iPhone 15 Pro Max","iPhone 16","iPhone 16 Pro","iPhone 16 Pro Max","OPPO A17k","realme 16T 5G","vivo iQOO Neo 10"];
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");phones.forEach(p=>{let o=document.createElement("option");o.value=p;document.getElementById("phones").appendChild(o)});
function seed(s){let n=0;for(let c of s)n=(n*31+c.charCodeAt(0))>>>0;return n}
function generate(){let raw=phone.value,key=norm(raw);error.style.display="none";result.style.display="none";suggest.style.display="none";if(!raw.trim()){error.textContent="⚠️ Nhập tên điện thoại trước đã.";error.style.display="block";return}let exact=phones.find(p=>norm(p)===key);if(!exact){error.textContent="❌ Mày bị não teo à 😭 Không có máy này trong danh sách!";error.style.display="block";let near=phones.filter(p=>norm(p).includes(key)||key.includes(norm(p))).slice(0,3);if(near.length){suggest.textContent="Máy gần giống: "+near.join(" • ");suggest.style.display="block"}return}let x=seed(exact),a=[];for(let i=0;i<6;i++){x=(x*1664525+1013904223)>>>0;a.push(x%101)}let names=["Tổng quan","Red Dot","2x Scope","4x Scope","Sniper","Free Look"];result.innerHTML="<h3>✅ "+exact+"</h3>"+names.map((n,i)=>`<div class="row"><span>${n}</span><span class="value">${a[i]}</span></div>`).join("");result.style.display="block"}
</script></body></html>
