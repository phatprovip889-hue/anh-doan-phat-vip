<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🔥 ANH ĐOÀN PHÁT VIP</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:22px 16px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:22px}h1{text-align:center;margin:0 0 6px}.sub{text-align:center;color:#aaa;margin-bottom:22px}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:15px;border-radius:12px;border:1px solid #444;background:#0d0d0d;color:#fff;font-size:16px}button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:12px;background:#fff;color:#000;font-weight:800;border-radius:12px}.error{display:none;margin-top:12px;padding:13px;border-radius:12px;background:#3a1111;border:1px solid #a33;color:#ffb2b2;font-weight:700}.result{display:none;margin-top:18px}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #292929}.value{font-weight:800}.suggest{display:none;margin-top:10px;color:#aaa;font-size:13px}.note{text-align:center;color:#888;font-size:12px;margin-top:16px}.sl{display:none;margin-top:6px;max-height:280px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0d0d0d;border:1px solid #444;border-radius:12px}.sl div{padding:14px 15px;border-bottom:1px solid #222;cursor:pointer;font-size:15px}.sl div:last-child{border-bottom:0}.sl div:hover,.sl div:active{background:#222}.sl .none{color:#888;cursor:default}.sl .more{color:#888;font-size:12px;text-align:center;cursor:default}</style></head>
<body><div class="wrap"><div class="card"><h1>🔥 ANH ĐOÀN PHÁT VIP</h1><p class="sub">Tạo độ nhạy Free Fire theo đúng tên điện thoại</p>
<label>Tên điện thoại</label><div class="sw"><input id="phone" type="search" autocomplete="off" placeholder="🔍 Tìm điện thoại, ví dụ: Samsung Galaxy A55 5G"><div id="sl" class="sl"></div></div><div id="error" class="error"></div><div id="suggest" class="suggest"></div><button onclick="generate()">✨ TẠO ĐỘ NHẠY</button><div id="result" class="result"></div><p class="note">Chỉ model có trong danh sách mới được tạo độ nhạy.</p></div></div>
<script>
const phones=["Samsung Galaxy A55 5G","Samsung Galaxy A35 5G","Samsung Galaxy A25 5G","Samsung Galaxy A15 5G","Samsung Galaxy S24","Samsung Galaxy S24 Ultra","Samsung Galaxy S23","Samsung Galaxy S23 Ultra","Xiaomi Mi 10S","Redmi 9C","Redmi Note 14 Pro 5G","Redmi Note 14T 5G","iPhone 8","iPhone 8 Plus","iPhone X","iPhone 11","iPhone 11 Pro","iPhone 11 Pro Max","iPhone 12","iPhone 12 Pro","iPhone 12 Pro Max","iPhone 13","iPhone 13 Pro","iPhone 13 Pro Max","iPhone 14","iPhone 14 Pro","iPhone 14 Pro Max","iPhone 15","iPhone 15 Pro","iPhone 15 Pro Max","iPhone 16","iPhone 16 Pro","iPhone 16 Pro Max","OPPO A17k","realme 16T 5G","vivo iQOO Neo 10"];
const G={
"Samsung Galaxy ":"S25,S25+,S25 Ultra,S24+,S24 FE,S23+,S23 FE,S22,S22+,S22 Ultra,S21,S21+,S21 Ultra,S21 FE,S20,S20+,S20 Ultra,S20 FE,Note 20,Note 20 Ultra,Note 10,Note 10+,Z Fold6,Z Flip6,Z Fold5,Z Flip5,Z Fold4,Z Flip4,A56 5G,A54 5G,A53 5G,A52,A52s 5G,A51,A34 5G,A33 5G,A32,A26 5G,A16 5G,A14,A13,A12,A06,A05s,M55,M35,M34 5G,M14",
"iPhone ":"6s,7,7 Plus,SE (2020),SE (2022),XR,XS,XS Max,12 mini,13 mini,14 Plus,15 Plus,16 Plus,16e,17,17 Pro,17 Pro Max,Air",

"Redmi ":"Note 14 Pro+ 5G,Note 14 Pro,Note 14 5G,Note 13 Pro+ 5G,Note 13 Pro,Note 13,Note 12 Pro,Note 12,Note 11 Pro,Note 11,Note 10 Pro,Note 10,Note 9 Pro,Note 8,14C,13C,12C,12,10C,10A,9A,9T,9,8A,A3,K70,K60",
"POCO ":"F7,F6,F6 Pro,F5,F5 Pro,F4 GT,F3,F2 Pro,X7 Pro,X6 Pro,X6,X5 Pro,X4 Pro,M6 Pro,M5,C75",

"realme ":"14 Pro+,13 Pro+,12 Pro+,11 Pro+,10 Pro+,9 Pro+,8,7,6,GT 6,GT 5,GT Neo 6,GT Neo 5,Narzo 70,Narzo 60,C67,C55,C53,C35,C33,C21Y,C11",

Object.entries(G).forEach(([b,l])=>l.split(",").forEach(m=>{let n=b+m.trim();if(!phones.includes(n))phones.push(n)}));
const norm=s=>s.trim().toLowerCase().replace(/\s+/g," ");function showList(){let w=norm(phone.value).split(" ").filter(Boolean),m=phones.filter(p=>{let n=norm(p);return w.every(t=>n.includes(t))});sl.innerHTML="";if(!m.length){sl.innerHTML='<div class="none">Không tìm thấy máy nào</div>'}else{m.slice(0,60).forEach(p=>{let d=document.createElement("div");d.textContent=p;d.onclick=()=>{phone.value=p;sl.style.display="none"};sl.appendChild(d)});if(m.length>60){let d=document.createElement("div");d.className="more";d.textContent="Còn "+(m.length-60)+" máy nữa, gõ thêm để lọc";sl.appendChild(d)}}sl.style.display="block"}
phone.addEventListener("input",showList);phone.addEventListener("focus",showList);document.addEventListener("click",e=>{if(!e.target.closest(".sw"))sl.style.display="none"});

function seed(s){let n=0;for(let c of s)n=(n*31+c.charCodeAt(0))>>>0;return n}
function generate(){let raw=phone.value,key=norm(raw);sl.style.display="none";error.style.display="none";result.style.display="none";suggest.style.display="none";if(!raw.trim()){error.textContent="⚠️ Nhập tên điện thoại trước đã.";error.style.display="block";return}let exact=phones.find(p=>norm(p)===key);if(!exact){error.textContent="❌ Mày bị não teo à 😭 Không có máy này trong danh sách!";error.style.display="block";let near=phones.filter(p=>norm(p).includes(key)||key.includes(norm(p))).slice(0,3);if(near.length){suggest.textContent="Máy gần giống: "+near.join(" • ");suggest.style.display="block"}return}let x=seed(exact),a=[];for(let i=0;i<6;i++){x=(x*1664525+1013904223)>>>0;a.push(x%101)}let names=["Tổng quan","Red Dot","2x Scope","4x Scope","Sniper","Free Look"];result.innerHTML="<h3>✅ "+exact+"</h3>"+names.map((n,i)=>`<div class="row"><span>${n}</span><span class="value">${a[i]}</span></div>`).join("");result.style.display="block"}
</script></body></html>
